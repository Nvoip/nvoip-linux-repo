name: qtkeychain
buildsystem: cmake-ninja
config-opts:
  - -DBUILD_WITH_QT6=ON
  - -DCMAKE_INSTALL_LIBDIR=lib
  - -DBUILD_TRANSLATIONS=OFF
  - -DBUILD_TEST_APPLICATION=OFF
sources:
  - type: archive
    url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.15.0.tar.gz
    sha256: f4254dc8f0933b06d90672d683eab08ef770acd8336e44dfa030ce041dc2ca22
    x-checker-data:
      type: json
      url: https://api.github.com/repos/frankosterfeld/qtkeychain/releases/latest
      version-query: .tag_name
      url-query: '"https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/" + $version + ".tar.gz"'
